name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Verify migrations on a clean database
        env:
          DATABASE_URL: "file:./prisma/ci-clean.db"
        run: |
          rm -f prisma/ci-clean.db
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > /tmp/workdesk-diff.sql
          grep -q -- "-- This is an empty migration." /tmp/workdesk-diff.sql
      - name: Lint
        run: npm run lint
      - name: Unit and isolated database tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: HTTP integration checks
        run: npm run test:http
